name: CI

on:
  push:
    branches:
      - dev
      - "feat/**"
      - "fix/**"
  pull_request:
    branches:
      - dev
      - master

jobs:
  messaging-version-pins:
    name: Messaging version pins
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Check messaging version pins
        run: python3 scripts/check_messaging_version_pins.py

  paper:
    name: Paper plugin
    needs: messaging-version-pins
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      # Both platforms resolve the messaging module from the local Maven repo, so it has to be
      # installed on the runner first (same as the first step of build-release.bat).
      - name: Install messaging module
        run: mvn -B -f enderman-grief-control-messaging/pom.xml install

      - name: Build and test Paper plugin
        run: mvn -B -f paper-plugin/pom.xml verify

      - uses: actions/upload-artifact@v4
        with:
          name: paper-plugin
          path: paper-plugin/target/*.jar
          if-no-files-found: error

  fabric:
    name: Fabric mod
    needs: messaging-version-pins
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Install messaging module
        run: mvn -B -f enderman-grief-control-messaging/pom.xml install

      - uses: gradle/actions/setup-gradle@v4

      # gradlew is committed without the executable bit (Windows checkout).
      - name: Build Fabric mod
        working-directory: fabric-mod
        run: sh gradlew build

      - uses: actions/upload-artifact@v4
        with:
          name: fabric-mod
          path: fabric-mod/build/libs/*.jar
          if-no-files-found: error
