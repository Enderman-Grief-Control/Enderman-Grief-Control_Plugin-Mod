# Done to increase the memory available to gradle.
org.gradle.jvmargs=-Xmx1G
org.gradle.parallel=true

# IntelliJ IDEA is not yet fully compatible with configuration cache.
org.gradle.configuration-cache=false

# Fabric properties (check current values at https://fabricmc.net/develop)
minecraft_version=1.21
loader_version=0.19.3
loom_version=1.17-SNAPSHOT

# Mod properties
mod_version=1.1.0
# Version of the shared enderman-grief-control-messaging module (installed by `mvn install`). Kept
# separate from mod_version so a release version passed in by CI (-Pmod_version=...) doesn't change
# which messaging build gets resolved.
messaging_version=1.1.0
maven_group=endermangriefcontrol

# Optional integrations (see build.gradle for why each is here)
modmenu_version=11.0.4
fabric_api_base_version=0.4.42+6573ed8cd1
fabric_command_api_v2_version=2.2.28+6ced4dd9d1
fabric_lifecycle_events_v1_version=2.3.12+6c1df360d1
fabric_entity_events_v1_version=1.6.12+6fc22b99d1

# Bridges Adventure's Component API into Fabric's chat system. Pinned to 5.14.0, the release
# built specifically against Minecraft 1.21 (matches minecraft_version above exactly - later
# releases target 1.21.1+ and aren't guaranteed compatible).
adventure_platform_fabric_version=5.14.0
