plugins {
	id 'net.fabricmc.fabric-loom-remap' version "${loom_version}"
}

// Release version by default (plain `./gradlew build`). For a dev build with a
// qualifier, pass -PversionSuffix=-SNAPSHOT on the command line.
version = project.mod_version + (project.findProperty('versionSuffix') ?: '')
group = project.maven_group

// EndermanGriefControl-mc_<mc version>-fabric-<version>[-SNAPSHOT]
base {
	archivesName = "EndermanGriefControl-mc_${project.minecraft_version}-fabric"
}

repositories {
	maven {
		name = 'TerraformersMC'
		url = 'https://maven.terraformersmc.com/releases/'
	}
	mavenCentral() // net.kyori adventure artifacts, and enderman-grief-control-messaging's own deps
	mavenLocal() // enderman-grief-control-messaging, installed locally via `mvn install`
}

dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings loom.officialMojangMappings()
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// The core grief-prevention feature only needs ModInitializer and Mixin, both provided
	// by fabric-loader itself, to keep the install footprint minimal. Two small additions
	// on top of that baseline:

	// Mod Menu integration is optional and compile-time only: if a player doesn't have Mod
	// Menu installed, this entrypoint is simply never invoked, so it's not a hard dependency.
	modCompileOnly "com.terraformersmc:modmenu:${project.modmenu_version}"

	// fabric-api-base is a hard dependency declared by all three modules included below
	// (command-api-v2, lifecycle-events-v1, entity-events-v1) - without it jar-in-jar'd
	// here too, Fabric Loader refuses to load any of them on a real server.
	modImplementation "net.fabricmc.fabric-api:fabric-api-base:${project.fabric_api_base_version}"
	include "net.fabricmc.fabric-api:fabric-api-base:${project.fabric_api_base_version}"

	// The in-game command needs a registration hook, which vanilla Fabric Loader doesn't
	// expose on its own. fabric-command-api-v2 is a small, focused module (not the full
	// Fabric API umbrella jar) purpose-built for this. `include` bundles it (jar-in-jar)
	// into our own output jar, so players don't have to separately install Fabric API.
	modImplementation "net.fabricmc.fabric-api:fabric-command-api-v2:${project.fabric_command_api_v2_version}"
	include "net.fabricmc.fabric-api:fabric-command-api-v2:${project.fabric_command_api_v2_version}"

	// Held-block resolution needs a repeating server tick hook and a server-started hook, neither
	// exposed by vanilla Fabric Loader. Same small-module, jar-in-jar approach as above.
	modImplementation "net.fabricmc.fabric-api:fabric-lifecycle-events-v1:${project.fabric_lifecycle_events_v1_version}"
	include "net.fabricmc.fabric-api:fabric-lifecycle-events-v1:${project.fabric_lifecycle_events_v1_version}"

	// ...and a mob-death callback, to prune a resolved/killed holder immediately instead of
	// waiting on the next resolution pass.
	modImplementation "net.fabricmc.fabric-api:fabric-entity-events-v1:${project.fabric_entity_events_v1_version}"
	include "net.fabricmc.fabric-api:fabric-entity-events-v1:${project.fabric_entity_events_v1_version}"

	// Bridges Adventure's Component API (already used natively by the Paper plugin) into Fabric's
	// chat system, so both platforms build chat/announcement messages through the same shared
	// enderman-grief-control-messaging module instead of hand-duplicating wording per platform.
	// Pinned to 5.14.0, the release built specifically against Minecraft 1.21 (this project's
	// exact minecraft_version - later releases target 1.21.1+ and aren't guaranteed compatible).
	modImplementation "net.kyori:adventure-platform-fabric:${project.adventure_platform_fabric_version}"
	include "net.kyori:adventure-platform-fabric:${project.adventure_platform_fabric_version}"

	modImplementation "endermangriefcontrol:enderman-grief-control-messaging:${project.messaging_version}"
	include "endermangriefcontrol:enderman-grief-control-messaging:${project.messaging_version}"
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}

	// Bakes ENDERMAN_GRIEF_TEST_MODE into the built jar at build time - see TestModeLogger. Only
	// needs to be set wherever the build runs, not wherever the resulting jar is later launched.
	def testMode = (System.getenv("ENDERMAN_GRIEF_TEST_MODE") ?: "false").toBoolean()
	inputs.property "testMode", testMode

	filesMatching("test-mode.properties") {
		expand "testMode": testMode
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 21
}

java {
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}
