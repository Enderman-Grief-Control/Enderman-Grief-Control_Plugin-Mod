# EndermanGriefControl configuration

# If a world is not listed under "worlds", this value decides
# whether the plugin is enabled there by default.
default-enabled: true

# Per-world overrides.
# Add world names and set them to true/false as needed.
# Example:
# worlds:
#   world: true
#   world_nether: false
#   world_the_end: true
worlds: {}

# Handling for endermen already stuck holding a block placement can no longer clear (e.g. picked
# up before the plugin was enabled, or during a window where it was toggled off). Checked every
# ~2 minutes. One of:
#   auto-clear - remove the carried block outright, nothing dropped (endermen only ever carry
#                common terrain blocks). The default - this is resolved automatically, no
#                configuration needed. Logged when "logging.removals" below is true (the default).
#   alert      - instead of clearing, periodically re-log its location so you can hunt it down and
#                kill it yourself, regardless of "logging" below. For players who'd rather nothing
#                be resolved on their behalf automatically.
#   off        - leave it alone entirely.
#
# If a world is not listed under "held-block-worlds", this value decides its handling by default.
default-held-block-handling: auto-clear

# Per-world overrides, same shape as "worlds" above.
# Example:
# held-block-worlds:
#   world_nether: alert
#   world_the_end: off
held-block-worlds: {}

logging:
  # If true, log whenever the plugin denies an enderman block pickup/placement.
  enabled: false
  # If true, log whenever a stuck holder is auto-cleared. Separate from "enabled" above - a clear
  # is a one-time confirmation the actual problem got fixed, not a repeating denial, so this
  # defaults to on even though denial logging defaults off.
  removals: true
  # Minimum seconds between denial chat announcements, per world and denial type (placement and
  # pickup are throttled independently). Denials that happen faster than this are still counted
  # and rolled into the next chat message ("Denied placement x4.") rather than dropped silently. Does not
  # affect the console/server-log line, which still logs every individual denial. Set to 0 to
  # announce every single denial in chat (the old behavior).
  denial-rate-limit-seconds: 10

# Chat announcement wording/colors. Shared in shape with the Fabric mod's equivalent config, and
# tolerant of missing/misspelled entries - anything absent or unrecognized falls back to its
# default shown below rather than failing to load. Colors are Minecraft's standard 16 names
# (e.g. dark_purple, gold, aqua) in lowercase.
messages:
  prefix: "[Enderman] "
  denied-placement:
    prefix-color: dark_purple
    body: "Denied placement"
    body-color: gray
    coords-color: dark_green
  denied-pickup:
    prefix-color: light_purple
    body: "Denied pickup"
    body-color: gray
    coords-color: dark_green
  held-block-alert:
    prefix-color: red
    body: "holding a block at "
    body-color: gray
    coords-color: green
  held-block-cleared:
    prefix-color: aqua
    body: "holding block cleared"
    body-color: gray
    coords-color: dark_green
